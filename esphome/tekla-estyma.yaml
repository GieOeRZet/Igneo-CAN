select:
  # Tryb pracy obiegow: zapis 0x0100 | tryb (256 Off, 257 Eko, 258 Harmonogram, 259 Komfort) - typ U16 (cs 0x2B).
  - platform: template
    name: "${'CO1' if dwa_obiegi_co else 'CO'} tryb ustaw"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    id: co_mode_sel
    icon: "mdi:radiator"
    options: ["Off", "Eko", "Harmonogram", "Komfort"]
    optimistic: false
    update_interval: 5s
    lambda: |-
      if (!id(co_mode_text).has_state()) return {};
      return id(co_mode_text).state;
    set_action:
      - script.execute:
          id: mode_send
          idx: 0x2064
          mode: !lambda 'return (int) (x == "Off" ? 0 : x == "Eko" ? 1 : x == "Harmonogram" ? 2 : 3);'
  - platform: template
    name: "CO2 tryb ustaw"
    id: co2_mode_sel
    icon: "mdi:radiator"
    internal: ${mirror == "true" or not dwa_obiegi_co}
    options: ["Off", "Eko", "Harmonogram", "Komfort"]
    optimistic: false
    update_interval: 5s
    lambda: |-
      if (!id(co2_mode_text).has_state()) return {};
      return id(co2_mode_text).state;
    set_action:
      - script.execute:
          id: mode_send
          idx: 0x2065
          mode: !lambda 'return (int) (x == "Off" ? 0 : x == "Eko" ? 1 : x == "Harmonogram" ? 2 : 3);'
  - platform: template
    name: "CWU tryb ustaw"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    id: cwu_mode_sel
    icon: "mdi:water-boiler"
    options: ["Off", "Eko", "Harmonogram", "Komfort"]
    optimistic: false
    update_interval: 5s
    lambda: |-
      if (!id(cwu_mode_text).has_state()) return {};
      return id(cwu_mode_text).state;
    set_action:
      - script.execute:
          id: mode_send
          idx: 0x2014
          mode: !lambda 'return (int) (x == "Off" ? 0 : x == "Eko" ? 1 : x == "Harmonogram" ? 2 : 3);'

switch:
  - platform: restart
    name: "Restart"
    icon: "mdi:restart"
  # Wlacz/wylacz kociol przez rejestr 0x2005 (KANDYDAT - potwierdzony tylko obserwacja). Wymaga power_write: "true".
  - platform: template
    name: "Kociol wlacz/wylacz"
    id: boiler_power_sw
    icon: "mdi:fire"
    # WAZNE: bez tego ESPHome przy kazdym starcie ESP wola turn_off_action (domyslnie "always OFF") i WYLACZA kociol.
    restore_mode: DISABLED
    lambda: |-
      // Po restarcie, zanim kociol odpowie: ostatni znany stan (pierwszy start: wlaczony).
      if (id(boiler_on).has_state()) return id(boiler_on).state;
      return id(boiler_on_last);
    turn_on_action:
      - script.execute:
          id: set_power
          want_on: true
    turn_off_action:
      - script.execute:
          id: set_power
          want_on: false

script:
  # v2.25: kolejkuje odczyt calej historii alarmow z kotla (kody, czasy poczatku i konca; 20 slotow)
  - id: alarm_hist_q
    mode: single
    then:
      - lambda: |-
          auto &q = id(par_q);
          if (q.size() > 100) return;
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4010 + i));
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4024 + i));
          for (int i = 0; i < 20; i++) q.push_back((uint16_t) (0x4038 + i));
  # Publikuje wpis historii: "kod ...|poczatek (unix)|koniec (unix)"; pusty slot = "-"
  - id: ah_publish
    mode: queued
    max_runs: 60
    parameters:
      slot: int
    then:
      - lambda: |-
          if (slot < 0 || slot > 19 || id(ah_raw).size() < 20) return;
          text_sensor::TextSensor *s[] = {id(ah_0), id(ah_1), id(ah_2), id(ah_3), id(ah_4), id(ah_5), id(ah_6), id(ah_7), id(ah_8), id(ah_9), id(ah_10), id(ah_11), id(ah_12), id(ah_13), id(ah_14), id(ah_15), id(ah_16), id(ah_17), id(ah_18), id(ah_19)};
          std::string o = "-";
          if (!id(ah_txt)[slot].empty()) {
            char b[40]; snprintf(b, sizeof(b), "|%u|%u", (unsigned) id(ah_t0)[slot], (unsigned) id(ah_t1)[slot]);
            o = id(ah_txt)[slot] + b;
          }
          s[slot]->publish_state(o);
  # Kolejkuje odczyt ustawien do biezacego poziomu dostepu (0 = uzytkownik, 1 = klucz 1, 2 = klucz 2).
  - id: par_refresh
    mode: restart
    then:
      - lambda: |-
          static const uint16_t l0[] = {0x2270,0x2271,0x2273,0x2212,0x2210,0x300D};
          static const uint16_t l1[] = {0x2261,0x2262,0x2263,0x2264,0x2265,0x2256,0x226A,0x2289,0x3704,0x300C,0x2290,0x299A,0x226B,0x3605,0x214E,0x2152,0x2258,0x2999,0x3715,0x3716,0x3717,0x2208,0x2291,0x22BD,0x22C1,0x2142,0x22C5,0x22C9,0x22CD};
          static const uint16_t l2[] = {0x2153,0x3003,0x370B,0x300E};
          auto &q = id(par_q);
          q.clear();
          for (auto r : l0) q.push_back(r);
          if (id(access_level) >= 1) for (auto r : l1) q.push_back(r);
          if (id(access_level) >= 2) for (auto r : l2) q.push_back(r);
  # Moc palnika [kW] i spalanie [kg/h] liczone w ESP (v2.20).
  - id: burner_calc
    mode: restart
    then:
      - lambda: |-
          const float test = id(fuel_test).state, tmax = id(p_feed_max).state, per = id(p_feeder_period).state;
          const float cv = id(fuel_heat).state, p = id(burner_power).state;
          if (isnan(test) || isnan(tmax) || isnan(per) || isnan(cv) || isnan(p) || per <= 0) return;
          const float kgh100 = test * tmax / per;
          const float kw = kgh100 * cv * ${burner_eff_kw} * p / 100.0f;
          id(burner_kw).publish_state(roundf(kw * 10.0f) / 10.0f);
          id(burner_fuel_rate).publish_state(roundf(kw / (cv * ${burner_eff_fuel}) * 10.0f) / 10.0f);
  # Ogolny zapis rejestru z karty (size 2 = cs 0x2B, 4 = cs 0x23); po zapisie odczyt zwrotny, wynik w logach i "SDO ostatni odczyt".
  - id: reg_write
    mode: queued
    max_runs: 30
    parameters:
      idx: int
      val: int
      size: int
    then:
      - lambda: |-
          if (millis() < 30000) { ESP_LOGW("igneo", "Zapis zablokowany tuz po starcie ESP"); return; }
          if (id(igneo_can)->is_failed()) { ESP_LOGW("igneo", "Zapis: CAN niedostepny"); return; }
          const uint8_t cs = (size == 2) ? 0x2B : 0x23;
          std::vector<uint8_t> d = {cs, (uint8_t) (idx & 0xFF), (uint8_t) (idx >> 8), 0x01,
                                    (uint8_t) (val & 0xFF), (uint8_t) ((val >> 8) & 0xFF), (uint8_t) ((val >> 16) & 0xFF), (uint8_t) ((val >> 24) & 0xFF)};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "ZAPIS KARTA: 0x%04X <- %d (cs 0x%02X)", (unsigned) idx, val, (unsigned) cs);
      - delay: 400ms
      - lambda: |-
          std::vector<uint8_t> d = {0x40, (uint8_t) (idx & 0xFF), (uint8_t) (idx >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);
      - delay: 200ms
  - id: mode_send
    mode: queued
    parameters:
      idx: int
      mode: int
    then:
      - lambda: |-
          if ((std::string("${mirror}") == "true" || std::string("${mode_write}") != "true")) { ESP_LOGW("igneo", "Zmiana trybu wylaczona (mode_write: false)"); return; }
          if (millis() < 30000) { ESP_LOGW("igneo", "Zmiana trybu zablokowana tuz po starcie ESP"); return; }
          const uint32_t v = 0x0100 | (uint32_t) (mode & 3);
          std::vector<uint8_t> d = {0x2B, (uint8_t) (idx & 0xFF), (uint8_t) (idx >> 8), 0x01, (uint8_t) (v & 0xFF), (uint8_t) (v >> 8), 0, 0};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "TRYB: 0x%04X <- 0x%04X", (unsigned) idx, (unsigned) v);
  - id: set_power
    mode: restart
    parameters:
      want_on: bool
    then:
      # Zabezpieczenie: w pierwszych 30 s po starcie ESP nie wysylamy zadnego zapisu do kotla.
      - if:
          condition:
            lambda: 'return millis() < 30000;'
          then:
            - logger.log:
                level: WARN
                format: "Sterowanie kotlem zablokowane tuz po starcie ESP (pierwsze 30 s)"
            - script.stop: set_power
      - lambda: |-
          if (std::string("${power_write}") != "true") {
            ESP_LOGW("igneo", "Sterowanie kotlem wylaczone (power_write: false)");
            return;
          }
          const int t = (id(power_type) == 0) ? 0x06 : id(power_type);
          const uint8_t cs = (t == 0x05) ? 0x2F : ((t == 0x06 || t == 0x03) ? 0x2B : 0x23);
          // Wariant A: zachowaj gorny bajt tak jak kociol go zwraca (0x0100 / 0x0101).
          // Wariant B (po nieudanej probie): czyste 0 / 1.
          uint32_t v = want_on ? 1 : 0;
          if (!id(power_alt) && cs != 0x2F) v |= (id(power_raw) & 0xFF00);
          std::vector<uint8_t> d = {cs, 0x05, 0x20, 0x01, (uint8_t) (v & 0xFF), (uint8_t) ((v >> 8) & 0xFF),
                                    (uint8_t) ((v >> 16) & 0xFF), (uint8_t) ((v >> 24) & 0xFF)};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "STEROWANIE KOTLEM: 0x2005 <- 0x%04X (typ 0x%02X, cs 0x%02X, wariant %s)",
                   (unsigned) v, t, cs, id(power_alt) ? "B" : "A");
      - delay: 4s
      - lambda: |-
          if (id(boiler_on).state == want_on) {
            ESP_LOGW("igneo", "KOCIOL ZMIENIL STAN: %s", want_on ? "wlaczony" : "wylaczony");
          } else {
            id(power_alt) = !id(power_alt);
            ESP_LOGW("igneo", "Kociol nie zmienil stanu - nastepne klikniecie sprobuje wariant %s", id(power_alt) ? "B" : "A");
          }
  # Podajnik: zapis trybu do rejestru 0x2259 (0 = Automat, 1 = Wylaczony, 2 = Wlaczony), jak przy wlacz/wylacz kotla.
  - id: feeder_send
    mode: queued
    parameters:
      fm: int
    then:
      - lambda: |-
          if ((std::string("${mirror}") == "true" || std::string("${feeder_write}") != "true")) {
            ESP_LOGW("igneo", "Sterowanie podajnikiem wylaczone (feeder_write: false)");
            return;
          }
          const int t = (id(feeder_type) == 0) ? 0x06 : id(feeder_type);
          const uint8_t cs = (t == 0x05) ? 0x2F : ((t == 0x06 || t == 0x03) ? 0x2B : 0x23);
          // Wariant A: zachowaj gorny bajt tak jak zwraca kociol (0x0100/0x0101/0x0102). Wariant B: czyste 0/1/2.
          uint32_t v = (uint32_t) fm;
          if (!id(feeder_alt) && cs != 0x2F) v |= (id(feeder_raw) & 0xFF00);
          std::vector<uint8_t> d = {cs, 0x59, 0x22, 0x01, (uint8_t) (v & 0xFF), (uint8_t) ((v >> 8) & 0xFF),
                                    (uint8_t) ((v >> 16) & 0xFF), (uint8_t) ((v >> 24) & 0xFF)};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "STEROWANIE PODAJNIKIEM: 0x2259 <- 0x%04X (typ 0x%02X, cs 0x%02X, wariant %s)",
                   (unsigned) v, t, cs, id(feeder_alt) ? "B" : "A");
  - id: set_feeder
    mode: restart
    parameters:
      fm: int
    then:
      # Zabezpieczenia podawania recznego: tylko przy wlaczonym kotle, nie tuz po starcie ESP, nie drugi raz w trakcie.
      - if:
          condition:
            lambda: 'return fm == 2 && (millis() < 30000 || !id(boiler_on).state || (id(feeder_raw) & 0xFF) == 2);'
          then:
            - lambda: 'ESP_LOGW("igneo", "Podawanie reczne zablokowane (kociol wylaczony / tuz po starcie / juz trwa)");'
            - script.stop: set_feeder
      - script.execute:
          id: feeder_send
          fm: !lambda 'return fm;'
      - delay: 8s   # odczyt 0x2259 wraca w cyklu co ok. 6-7 s
      - lambda: |-
          if ((id(feeder_raw) & 0xFF) == (uint32_t) fm) {
            ESP_LOGW("igneo", "PODAJNIK ZMIENIL TRYB: %d", fm);
          } else if ((std::string("${mirror}") != "true" && std::string("${feeder_write}") == "true")) {
            id(feeder_alt) = !id(feeder_alt);
            ESP_LOGW("igneo", "Podajnik nie zmienil trybu - nastepne klikniecie sprobuje wariant %s", id(feeder_alt) ? "B" : "A");
          }
      # Po "ON" wraca sam do Automatu (zabezpieczenie przed sypaniem opalu bez konca).
      - if:
          condition:
            lambda: 'return fm == 2 && ${feeder_on_seconds} > 0 && (std::string("${mirror}") != "true" && std::string("${feeder_write}") == "true");'
          then:
            - delay: ${feeder_on_seconds}s
            - script.execute:
                id: feeder_send
                fm: 0
            - lambda: 'ESP_LOGW("igneo", "PODAJNIK: powrot do Automatu po ${feeder_on_seconds} s");'
  # Dmuchawa: zapis trybu do rejestru 0x2283 (0 = Automat, 1 = Wylaczona, 2 = Wlaczona). Predkosc w trybie ON ustawiasz na panelu.
  - id: blower_send
    mode: queued
    parameters:
      bm: int
    then:
      - lambda: |-
          if ((std::string("${mirror}") == "true" || std::string("${blower_write}") != "true")) {
            ESP_LOGW("igneo", "Sterowanie dmuchawa wylaczone (blower_write: false)");
            return;
          }
          const int t = (id(blower_type) == 0) ? 0x06 : id(blower_type);
          const uint8_t cs = (t == 0x05) ? 0x2F : ((t == 0x06 || t == 0x03) ? 0x2B : 0x23);
          uint32_t v = (uint32_t) bm;
          if (!id(blower_alt) && cs != 0x2F) v |= (id(blower_raw) & 0xFF00);
          std::vector<uint8_t> d = {cs, 0x83, 0x22, 0x01, (uint8_t) (v & 0xFF), (uint8_t) ((v >> 8) & 0xFF),
                                    (uint8_t) ((v >> 16) & 0xFF), (uint8_t) ((v >> 24) & 0xFF)};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "STEROWANIE DMUCHAWA: 0x2283 <- 0x%04X (typ 0x%02X, cs 0x%02X, wariant %s)",
                   (unsigned) v, t, cs, id(blower_alt) ? "B" : "A");
  - id: set_blower
    mode: restart
    parameters:
      bm: int
    then:
      - script.execute:
          id: blower_send
          bm: !lambda 'return bm;'
      - delay: 8s   # odczyt 0x2283 wraca w cyklu co ok. 6-7 s
      - lambda: |-
          if ((id(blower_raw) & 0xFF) == (uint32_t) bm) {
            ESP_LOGW("igneo", "DMUCHAWA ZMIENILA TRYB: %d", bm);
          } else if ((std::string("${mirror}") != "true" && std::string("${blower_write}") == "true")) {
            id(blower_alt) = !id(blower_alt);
            ESP_LOGW("igneo", "Dmuchawa nie zmienila trybu - nastepne klikniecie sprobuje wariant %s", id(blower_alt) ? "B" : "A");
          }
      - if:
          condition:
            lambda: 'return bm == 2 && ${blower_on_seconds} > 0 && (std::string("${mirror}") != "true" && std::string("${blower_write}") == "true");'
          then:
            - delay: ${blower_on_seconds}s
            - script.execute:
                id: blower_send
                bm: 0
            - lambda: 'ESP_LOGW("igneo", "DMUCHAWA: powrot do Automatu po ${blower_on_seconds} s");'
  # Przekazniki IN16 (zgoda na prace) / IN3 (termostat) - pozniej, po uruchomieniu CAN.
  # Wolny pin wybierzemy dopiero przy podlaczaniu przekaznikow (nie GPIO17/18/19/20 - to SPI CAN).
  # - platform: gpio
  #   name: "Zgoda na prace"
  #   icon: "mdi:lightbulb"
  #   pin: GPIOxx
  #   id: relay_zgoda

# Przelacznik antenowy XIAO ESP32-C6 (uzywany tylko gdy external_antenna: "true").
output:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_enable
  - platform: gpio
    pin: GPIO14
    id: rf_ant_select

button:
  - platform: template
    name: "Potwierdz alarm"
    icon: "mdi:bell-check"
    on_press:
      - lambda: |-
          if (std::string("${alarm_confirm}") != "true") { ESP_LOGW("igneo", "Potwierdzanie alarmu wylaczone"); return; }
          const int slot = id(alarm_slot);
          const uint32_t raw = id(alarm_raw);
          if (slot < 0 || slot > 19 || (raw & 0xFFFF) == 0) { ESP_LOGW("igneo", "Brak alarmu do potwierdzenia"); return; }
          // Odczytany rejestr + bit 18 (zadanie potwierdzenia). Zapis 32-bit (cs 0x23).
          const uint32_t v = raw | (1u << 18);
          const uint16_t ix = 0x4010 + slot;
          std::vector<uint8_t> d = {0x23, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01,
                                    (uint8_t) (v & 0xFF), (uint8_t) ((v >> 8) & 0xFF), (uint8_t) ((v >> 16) & 0xFF), (uint8_t) ((v >> 24) & 0xFF)};
          id(igneo_can)->send_data(0x604, false, d);
          ESP_LOGW("igneo", "POTWIERDZENIE alarmu 0x%04X = 0x%08X", ix, (unsigned) v);

  - platform: template
    name: "Podajnik: Automat"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:auto-mode"
    on_press:
      - script.execute:
          id: set_feeder
          fm: 0
  - platform: template
    name: "Podajnik: Wylacz"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:stop-circle-outline"
    on_press:
      - script.execute:
          id: set_feeder
          fm: 1
  - platform: template
    name: "Podajnik: Podaj paliwo (30 s)"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:play-circle-outline"
    on_press:
      - script.execute:
          id: set_feeder
          fm: 2
  - platform: template
    name: "Migawka katalogowa (tylko istniejace rejestry)"
    icon: "mdi:camera-burst"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(scan_on)) { ESP_LOGW("igneo", "Skan/migawka juz trwa"); return; }
          id(snap_new).clear();
          id(cat_mode) = true;
          id(scan_cur) = 0;
          id(scan_end) = 592;
          id(scan_sub) = 1;
          id(snap_on) = true;
          id(scan_on) = true;
          ESP_LOGW("igneo", "Migawka katalogowa start (593 rejestrow)");
  - platform: template
    name: "Migawka STOP"
    icon: "mdi:stop"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(scan_on) = false;
          id(snap_on) = false;
          ESP_LOGW("igneo", "Skan/migawka przerwane (przycisk web)");

  - platform: template
    name: "Dmuchawa: Automat"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:auto-mode"
    on_press:
      - script.execute:
          id: set_blower
          bm: 0
  - platform: template
    name: "Dmuchawa: Wylacz"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:fan-off"
    on_press:
      - script.execute:
          id: set_blower
          bm: 1
  - platform: template
    name: "Dmuchawa: Wlacz (czasowo)"
    internal: ${mirror}   # mirror: true => encja niewidoczna w HA (brak zapisu)
    icon: "mdi:fan"
    on_press:
      - script.execute:
          id: set_blower
          bm: 2

