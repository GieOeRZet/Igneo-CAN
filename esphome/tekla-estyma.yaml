                    ESP_LOGW("igneo", "ROZNICA%s 0x%04X: %u -> %u (0x%08X -> 0x%08X)", kn ? " (znany)" : "", pn.first,
                             (unsigned) (po.second & 0xFFFF), (unsigned) (pn.second & 0xFFFF), (unsigned) po.second, (unsigned) pn.second);
                    diffs++;
