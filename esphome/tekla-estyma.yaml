    name: "Wersja firmware"
    id: fw_ver
    entity_category: diagnostic
    lambda: 'return std::string("${fw_version}") + (std::string("${mirror}") == "true" ? " (mirror)" : "");'
  - platform: template
    id: sig_txt
    name: "Sygnatura konfiguracji"
    icon: "mdi:fingerprint"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1h
    lambda: |-
      static const uint8_t a[] = {0x19, 0x61, 0x19, 0x3B, 0x67, 0x13, 0x28};
      static const uint8_t b[] = {0x29, 0x5C, 0x08, 0x7C, 0x11, 0x3B, 0x7D};
      static const uint8_t c[] = {0x5C, 0x1D, 0x7C, 0x0E, 0x20};
      static const uint8_t k[] = {0x5A, 0x13, 0x7C};
      std::string o;
      size_t n = 0;
      for (uint8_t v : a) o += (char) (v ^ k[n++ % 3]);
      for (uint8_t v : b) o += (char) (v ^ k[n++ % 3]);
      for (uint8_t v : c) o += (char) (v ^ k[n++ % 3]);
      return o;
