# =====================================================================
# Tekla / Estyma Igneo Touch -> Home Assistant: PLIK UZYTKOWNIKA (ustawienia).
# Logika firmware pobiera sie sama z GitHuba przy kazdej kompilacji (packages nizej).
# Aktualizacja: w ESPHome kliknij "Install" - pobierze najnowsza wersje rdzenia.
# Hasla i klucz biora sie z secrets.yaml (wzor: secrets.example.yaml).
# Historia zmian: CHANGELOG-firmware.md w repo.
# =====================================================================
substitutions:
  # ===================================================================
  # 1. WI-FI I ADRES IP
  # ===================================================================
  wifi_ssid: !secret wifi_ssid_iot
  wifi_password: !secret wifi_pass
  ap_pass: "11223344"        # haslo awaryjnej sieci "Tekla-Estyma Fallback" - jawne tutaj; WPA2 wymaga min. 8 znakow
  # Staly adres IP: "true" = adres z trzech wartosci ponizej (wpisz swoje!), "false" = adres z DHCP.
  static_ip: "true"
  device_ip: 192.168.10.250
  device_gateway: 192.168.10.1
  device_subnet: 255.255.254.0

  # ===================================================================
  # 2. KLUCZ API I HASLO OTA
  # ===================================================================
  api_key: !secret esp_api_key_tekla_CAN
  ota_password: !secret ota_pass

  # ===================================================================
  # 3. UKLAD CO
  # ===================================================================
  # true = CO1 i CO2 (nazwy "CO1 ...", "CO2 ..."); false = jeden obieg "CO ...". Bez cudzyslowow.
  dwa_obiegi_co: false

  # ===================================================================
  # 4. NAZWA URZADZENIA
  # ===================================================================
  name: tekla-estyma
  friendly_name: "Tekla"

  # Inne ustawienia (domyslne wartosci sa w rdzeniu). Aby zmienic, dopisz tutaj, np.:
  #   mirror: "true"             # tylko podglad, bez zapisow do kotla
  #   can_bitrate: 125KBPS
  #   can_clock: 16MHZ
  #   external_antenna: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  # Rdzen firmware z GitHuba (odswiezany co godzine przy kompilacji).
  tekla:
    url: https://github.com/GieOeRZet/PelletCAN
    ref: main
    files: [esphome/tekla-estyma-core.yaml]
    refresh: 1h
  # Staly adres IP przelaczany substitution static_ip (dodaje wifi.manual_ip).
  network_ip: "${ {'wifi': {'manual_ip': {'static_ip': device_ip, 'gateway': device_gateway, 'subnet': device_subnet}}} if static_ip == 'true' else {} }"
