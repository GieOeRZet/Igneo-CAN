                case 0x2007: {
                  id(burner_state_code).publish_state((float) low);
                  char unk[32];
                  snprintf(unk, sizeof(unk), "nieznany (kod %u)", (unsigned) low);
                  const char *s = unk;
                  switch (low) {
                    case 0: s = "Wylaczony"; break;
                    case 1: s = "Rozpalanie"; break;
                    case 2: s = "Zarzenie"; break;
                    case 5: s = "Modulacja"; break;
                    case 6: s = "Wygaszanie / czyszczenie"; break;
                    case 7: s = "Czyszczenie"; break;
                    case 8: s = "Pauza"; break;
                    case 9: s = "Stop"; break;
                    case 10: s = "Alarm"; break;
                  }
                  id(burner_state_text).publish_state(s);
                  break;
                }
                case 0x2005:
                  id(power_raw) = raw;
                  id(boiler_on).publish_state(low != 0);
                  id(boiler_on_last) = (low != 0);
                  break;
                case 0x2002: {
                  char unk[32];
                  snprintf(unk, sizeof(unk), "nieznany (kod %u)", (unsigned) raw);
                  const char *s = unk;
                  switch (raw) {
                    case 0: s = "Czasowy auto"; break;
                    case 1: s = "Czasowy reczny"; break;
                    case 2: s = "Auto"; break;
                    case 3: s = "Reczny"; break;
                  }
                  id(boiler_mode_text).publish_state(s);
                  break;
                }
                case 0x2064:
                case 0x2065:
                case 0x2014: {
                  const uint32_t m = raw & 0xFF;
                  const char *t = m == 0 ? "Off" : m == 1 ? "Eko" : m == 2 ? "Harmonogram" : m == 3 ? "Komfort" : "nieznany";
                  if (idx == 0x2064) id(co_mode_text).publish_state(t); else if (idx == 0x2065) id(co2_mode_text).publish_state(t); else id(cwu_mode_text).publish_state(t);
                  break;
                }
                case 0x2259: {
                  id(feeder_raw) = raw;
                  const uint32_t m = raw & 0xFF;
                  id(feeder_mode_text).publish_state(m == 0 ? "Automat" : m == 1 ? "Wylaczony" : m == 2 ? "Wlaczony" : "nieznany");
                  break;
                }
                case 0x2283: {
                  id(blower_raw) = raw;
                  const uint32_t m = raw & 0xFF;
                  id(blower_mode_text).publish_state(m == 0 ? "Automat" : m == 1 ? "Wylaczona" : m == 2 ? "Wlaczona" : "nieznany");
                  break;
                }
                case 0x2006: id(in_zakaz).publish_state((raw & 1) == 0); break;   // 257 = brak zakazu, 256 = zakaz
                case 0x2301: id(in_regulator).publish_state((raw & 1) == 1); break;   // 257 = regulator pozwala grzac, 256 = nie
                case 0x2254: id(blower_pct).publish_state((float) (raw & 0xFF)); break;
                case 0x3600: {
                  float c = (float) (raw & 0xFFFF);
                  id(tank_cap).publish_state(c);
                  float k = id(tank_kg).state;
                  if (c > 0 && !isnan(k)) id(tank_pct).publish_state(roundf(k * 100.0f / c));
                  break;
                }
                case 0x3601: {
                  float k = (float) (raw & 0xFFFF);
                  id(tank_kg).publish_state(k);
                  float c = id(tank_cap).state;
                  if (c > 0 && !isnan(c)) id(tank_pct).publish_state(roundf(k * 100.0f / c));
                  break;
                }
                case 0x2267: id(feed_manual_off).publish_state((float) (raw & 0xFFFF)); break;
                case 0x370D: id(feed_manual_run).publish_state((float) (raw & 0xFFFF)); break;
                case 0x404D: break;  // liczba alarmow - na razie tylko w logu
                case 0x3608: case 0x3609: case 0x3611: case 0x3612: case 0x3507: case 0x3618: case 0x3619: case 0x362A: {
                  const int si = idx == 0x3608 ? 0 : idx == 0x3609 ? 1 : idx == 0x3611 ? 2 : idx == 0x3612 ? 3 : idx == 0x3507 ? 4 : idx == 0x3618 ? 5 : idx == 0x3619 ? 6 : 7;
                  if (id(stats).size() != 8) id(stats).assign(8, -1);
                  id(stats)[si] = (int32_t) raw;
                  std::string so; char st[16];
                  for (size_t k = 0; k < 8; k++) { if (id(stats)[k] < 0) snprintf(st, sizeof(st), "--"); else snprintf(st, sizeof(st), "%d", (int) id(stats)[k]); if (k) so += ' '; so += st; }
                  id(stat_txt).publish_state(so);
                  break;
                }
                // === TU DOPISUJ NOWE REJESTRY (np. harmonogramy): ===
                // case 0x2XXX: id(moja_encja).publish_state(t); break;
                default:
                  // Nieznany rejestr -> pokaz w HA, zeby latwo go zobaczyc.
                  id(sdo_last).publish_state(buf);
                  break;
              }

interval:
  # Cykliczny odczyt znanych rejestrow (jeden na 250 ms).
  - interval: 250ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed()) return;  // brak MCP2515 - nie wysylamy
          if (id(scan_on)) return;  // podczas skanu nie zasmiecamy magistrali
          static const uint16_t idxs[] = {
            0x2001, 0x2003, 0x2004,
            0x4001, 0x2146, 0x22AD, 0x2299,
            0x4002, 0x2147, 0x22AE, 0x229A,
            0x2110, 0x2010, 0x2012, 0x2032, 0x2048, 0x201A, 0x2278,
            0x215F, 0x4005, 0x2007, 0x2002, 0x2005, 0x2259, 0x2283, 0x2254,
            0x3600, 0x3601, 0x2267, 0x370D,   // zbiornik: pojemnosc, ilosc; czas podawania recznego (do weryfikacji)
            0x226C,   // temperatura palnika [C] (raw/10) - kandydat, do potwierdzenia na panelu
            0x2272,   // ilosc paliwa test [kg/h] (raw/10, 5..100)
            0x4000,   // temperatura powrotu [C] (raw/10; potwierdzone z panelem)
            0x2292,   // wartosc opalowa [kWh/kg] (flaga + bajt /10, 2..10; potwierdzone testem 4,6 -> 4,7; 0x2289 nie reaguje na zmiane)
            0x2064, 0x2065, 0x2014,   // tryb pracy: CO1, CO2 (0x2065 wg wzorca - niezweryfikowany, czytany tylko przy dwa_obiegi_co: true) i CWU: 256 Off, 257 Eko, 258 Harmonogram/Czasowy, 259 Komfort
            0x2006, 0x2301,   // wejscia: zakaz rozpalenia (IN16) i zgoda regulatora (IN3): 257 = tak, 256 = nie
            0x2250, 0x226D, 0x2257, 0x3700,   // palnik na zywo (jasnosc, czas podawania) + skladniki mocy kW (podawanie max, okres)
            0x2250, 0x226D,
            // v2.24: ustawienia POZIOMU 0 czytane cyklicznie (moc min/max, wartosc opalowa 0x2270/0x2271/0x2273, CWU 0x2212/0x2210/0x300D); klucz 1 i 2 tylko po starcie, po PIN-ie, param_refresh i po zapisie
            0x2270, 0x2271, 0x2273, 0x2212, 0x2210, 0x300D,
            0x404C  // alarmy: pozycja -> potem odczyt ostatniego wpisu
            // dopisz tu kolejne rejestry, ktore maja byc czytane stale
          };
          // Typ rejestru 0x2005 (wlacz/wylacz) poznajemy sami, zeby zapis dzialal od pierwszego klikniecia.
          if (id(power_type) == 0) {
            static uint8_t tries = 0, tick = 0;
            if (++tick % 8 == 0) {
              if (++tries > 6) {
                id(power_type) = 0x06;  // brak odpowiedzi - zakladamy UNSIGNED16
                ESP_LOGW("igneo", "Typ 0x2005 nieznany - zakladam UNSIGNED16 (0x06)");
              } else {
                std::vector<uint8_t> q = {0x40, 0x05, 0x20, 0x02, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, q);
              }
            }
          }
          // Typ rejestru 0x2259 (podajnik) - tak samo jak dla 0x2005.
          if (id(feeder_type) == 0) {
            static uint8_t ftries = 0, ftick = 0;
            if (++ftick % 8 == 4) {
              if (++ftries > 6) {
                id(feeder_type) = 0x06;
                ESP_LOGW("igneo", "Typ 0x2259 nieznany - zakladam UNSIGNED16 (0x06)");
              } else {
                std::vector<uint8_t> q = {0x40, 0x59, 0x22, 0x02, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, q);
              }
            }
          }
          // Typ rejestru 0x2283 (dmuchawa).
          if (id(blower_type) == 0) {
            static uint8_t btries = 0, btick = 0;
            if (++btick % 8 == 6) {
              if (++btries > 6) {
                id(blower_type) = 0x06;
                ESP_LOGW("igneo", "Typ 0x2283 nieznany - zakladam UNSIGNED16 (0x06)");
              } else {
                std::vector<uint8_t> q = {0x40, 0x83, 0x22, 0x02, 0, 0, 0, 0};
                id(igneo_can)->send_data(0x604, false, q);
              }
            }
          }
          const size_t base = sizeof(idxs) / sizeof(idxs[0]);
          const size_t total = base + id(extra_poll).size();
          static size_t i = 0;
          if (i >= total) i = 0;
          const uint16_t ix = (i < base) ? idxs[i] : id(extra_poll)[i - base];
          i++;
          // Jeden obieg CO: nie pytamy kotla o rejestry CO2.
          if (${'false' if dwa_obiegi_co else 'true'} && (ix == 0x4002 || ix == 0x2147 || ix == 0x22AE || ix == 0x229A || ix == 0x2065)) return;
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);

  # Kolejka odczytu ustawien (po starcie: wszystkie poziomy; potem param_refresh / PIN / zapis): jeden rejestr na 200 ms.
  - interval: 200ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed() || id(scan_on)) return;
          if (!id(par_boot) && millis() > 40000) {
            id(par_boot) = true;
            // v2.24: po starcie czytamy WSZYSTKIE ustawienia (odczyt nie wymaga PIN-u): najpierw poziom 0, potem klucz 1, na koncu klucz 2
            static const uint16_t l0[] = {0x2270,0x2271,0x2273,0x2212,0x2210,0x300D};
            static const uint16_t l1[] = {0x2261,0x2262,0x2263,0x2264,0x2265,0x2256,0x226A,0x2289,0x3704,0x300C,0x2290,0x299A,0x226B,0x3605,0x214E,0x2152,0x2258,0x2999,0x3715,0x3716,0x3717,0x2208,0x2291,0x22BD,0x22C1,0x2142,0x22C5,0x22C9,0x22CD};
            static const uint16_t l2[] = {0x2153,0x3003,0x370B,0x300E};
            for (auto r : l0) id(par_q).push_back(r);
            for (auto r : l1) id(par_q).push_back(r);
            for (auto r : l2) id(par_q).push_back(r);
            id(ah_boot) = true;
            id(alarm_hist_q).execute();   // v2.25: cala historia alarmow z kotla (60 odczytow, ok. 12 s)
          }
          auto &q = id(par_q);
          if (q.empty()) return;
          const uint16_t ix = q.front();
          q.erase(q.begin());
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);

  # Harmonogramy: odczyt TYLKO na zadanie (akcja schedule_refresh = 21 rejestrow co 300 ms) + raz po starcie.
  - interval: 300ms
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed() || id(scan_on)) return;
          if (!id(sch_boot) && millis() > 30000) { id(sch_boot) = true; id(sch_k) = 0; id(sch_burst) = 29; }
          if (id(sch_burst) <= 0) return;
          static const uint16_t sch[] = {0x2154,0x2155,0x2156,0x2157,0x2158,0x2159,0x2160,
            0x2126,0x212A,0x212E,0x2132,0x2136,0x213A,0x213E,
            0x2209,0x220A,0x220B,0x220C,0x220D,0x220E,0x220F,
            0x3608,0x3609,0x3611,0x3612,0x3507,0x3618,0x3619,0x362A};
          const uint16_t ix = sch[id(sch_k) % 29];
          id(sch_k)++;
          id(sch_burst)--;
          std::vector<uint8_t> d = {0x40, (uint8_t) (ix & 0xFF), (uint8_t) (ix >> 8), 0x01, 0, 0, 0, 0};
          id(igneo_can)->send_data(0x604, false, d);

  # Automatyczna blokada poziomu dostepu po bezczynnosci (substitution pin_autolock_min, 0 = wylaczona).
  - interval: 10s
    then:
      - lambda: |-
          const int lim = atoi("${pin_autolock_min}");
          if (lim > 0 && id(access_level) > 0 && (millis() - id(access_t)) > (uint32_t) lim * 60000UL) {
            id(access_level) = 0;
            id(access_level_sensor).publish_state(0.0f);
            ESP_LOGI("igneo", "Poziom dostepu: blokada po bezczynnosci");
          }

  # Status CAN widoczny w HA i na stronie urzadzenia (encja "CAN OK").
  - interval: 5s
    then:
      - lambda: |-
          const bool ok = !id(igneo_can)->is_failed();
          id(can_ok).publish_state(ok);
          // PDO podajnika (0x456) moze przychodzic tylko przy zmianie - po 30 s bez ramki zakladamy "nie pracuje".
          if (millis() > 30000 && !id(feeder_running).has_state()) id(feeder_running).publish_state(false);
          if (millis() > 30000 && !id(blower_running).has_state()) id(blower_running).publish_state(false);
          ESP_LOGI("igneo", "STATUS CAN: %s", ok ? "OK" : "BLAD (FAILED)");

  # Awaryjnie: jesli MCP2515 nie wystartowal (zdarza sie czasem po wlaczeniu zasilania),
  # restart po 20 s i proba od nowa. Po 10 nieudanych startach ESPHome wchodzi w tryb awaryjny (tylko OTA).
  - interval: 20s
    then:
      - lambda: |-
          if (id(igneo_can)->is_failed() && std::string("${can_auto_restart}") == "true") {
            ESP_LOGW("igneo", "CAN nie wystartowal - restart");
            App.safe_reboot();
          }

  # Skaner rejestrow (aktywny tylko po akcji sdo_scan).
  - interval: 120ms
    then:
      - lambda: |-
          if (!id(scan_on) || id(igneo_can)->is_failed()) return;
