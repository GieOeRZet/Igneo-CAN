# Plytka Seeed CAN Bus Breakout na XIAO ESP32-C6.
# SPI: SCK=D8 (GPIO19), MISO=D9 (GPIO20), MOSI=D10 (GPIO18), CS=D7 (GPIO17).
# Zworka P1 na spodzie plytki = terminator 120 ohm (domyslnie rozlaczona).
spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20

canbus:
  - platform: mcp2515
    id: igneo_can
    cs_pin: GPIO17
    can_id: 0x604
    bit_rate: ${can_bitrate}
    clock: ${can_clock}
    data_rate: 1MHz  # wolniejsze SPI = pewniejsza komunikacja z MCP2515 na kabelkach/zlaczu
    # UWAGA: LISTENONLY wylacza wysylanie - nie uzywac, bo pytamy kociol o rejestry.
    on_frame:
      # Diagnostyka: kazda odebrana ramka (standardowe ID)
      - can_id: 0
        can_id_mask: 0
        then:
          - lambda: |-
              char b[64];
              int o = 0;
              for (size_t i = 0; i < x.size() && o < 56; i++) o += snprintf(b + o, sizeof(b) - o, "%02X ", x[i]);
              if (std::string("${can_debug}") == "true") {
                ESP_LOGI("igneo", "RX id=0x%03X dlc=%d data=%s", (unsigned) can_id, (int) x.size(), b);
              }
              // v2.27: NMT / heartbeat / emergency (0x000, 0x080-0x0FF, 0x700-0x77F) - jak panel buduje liste urzadzen; loguj nowe (id + dane)
              if (can_id == 0x000 || (can_id >= 0x080 && can_id <= 0x0FF) || (can_id >= 0x700 && can_id <= 0x77F)) {
                static std::set<std::string> nmt_seen;
                const std::string kn = std::to_string((unsigned) can_id) + "|" + b;
                if (nmt_seen.size() < 80 && nmt_seen.insert(kn).second) {
                  char nb[96];
                  snprintf(nb, sizeof(nb), "NMT id=0x%03X dlc=%d dane=%s", (unsigned) can_id, (int) x.size(), b);
                  ESP_LOGW("igneo", "%s", nb);
                  id(sdo_last).publish_state(nb);
                }
              }
              // ---- PODSLUCH SDO innych wezlow (panel, videRoom/videNET) ----
              // Loguje tylko NOWE ramki SDO lub takie, w ktorych zmienily sie dane. PDO (0x1xx-0x4xx) pomija.
              // Kazdy ZAPIS (cs 0x20..0x2F) loguje zawsze.
              // Podawanie reczne: panel nadaje PDO 0x2D7 (bajt0 = 1 gdy przycisk trzymany). Logujemy KAZDA ramke, zeby poznac okres.
              if (can_id == 0x2D7) ESP_LOGW("igneo", "FEED PDO 0x2D7 t=%u dane=%s", (unsigned) millis(), b);
              if (std::string("${sniff}") != "true") return;
              // PDO (dane procesowe 0x180..0x4FF): logujemy tylko ZMIANE konkretnego bajtu.
              // Bajty, ktore zmieniaja sie same (liczniki, temperatury) sa wyciszane po 6 zmianach na minute.
              if (can_id >= 0x180 && can_id < 0x500) {
                static uint8_t pdo_last[0x500][8];
                static uint8_t pdo_cnt[0x500][8];
                static bool pdo_known[0x500];
                static uint32_t pdo_win = 0;
                const uint32_t now = millis();
                if (now - pdo_win > 60000) { memset(pdo_cnt, 0, sizeof(pdo_cnt)); pdo_win = now; }
                const size_t pn = x.size() < 8 ? x.size() : 8;
                if (!pdo_known[can_id]) {
                  pdo_known[can_id] = true;
                  for (size_t i = 0; i < pn; i++) pdo_last[can_id][i] = x[i];
                  return;
                }
                for (size_t i = 0; i < pn; i++) {
                  if (x[i] != pdo_last[can_id][i]) {
                    if (pdo_cnt[can_id][i] < 6)
                      ESP_LOGW("igneo", "SNIFF PDO id=0x%03X bajt%d: %02X->%02X dane=%s", (unsigned) can_id, (int) i,
                               pdo_last[can_id][i], x[i], b);
                    if (pdo_cnt[can_id][i] < 255) pdo_cnt[can_id][i]++;
                    pdo_last[can_id][i] = x[i];
                  }
                }
                return;
              }
              if (x.size() < 8) return;
              const bool req = (can_id >= 0x600 && can_id <= 0x67F);
              const bool rsp = (can_id >= 0x580 && can_id <= 0x5FF);
              if (!req && !rsp) return;
              const uint16_t sidx = x[1] | (x[2] << 8);
              const uint8_t ssub = x[3];
              const uint8_t scs = x[0];
              // v2.27: identyfikacja urzadzen (panel -> zakladka Siec): loguj NOWE ramki SDO 0x1000/0x1008/0x1018 (zapytania i odpowiedzi, kazdy wezel)
              if (sidx == 0x1000 || sidx == 0x1008 || sidx == 0x1018) {
                static std::set<std::string> ident_seen;
                const std::string k = std::string(req ? "REQ " : "RSP ") + b;
                const std::string kk = std::to_string((unsigned) can_id) + k;
                if (ident_seen.size() < 80 && ident_seen.insert(kk).second) {
                  char ib[96];
                  snprintf(ib, sizeof(ib), "IDENT %s id=0x%03X idx=0x%04X sub=%u dane=%s", req ? "zapytanie" : "odpowiedz", (unsigned) can_id, (unsigned) sidx, (unsigned) ssub, b);
                  ESP_LOGW("igneo", "%s", ib);
                  id(sdo_last).publish_state(ib);
                }
              }
              if (req && sidx == 0x1018) return;  // skan wezlow (identyfikator urzadzenia) - po zalogowaniu
              if (can_id == 0x584) {
                // odpowiedzi na NASZE odczyty pomijamy (lista + bufor alarmow)
                static const uint16_t mine[] = {0x2001,0x2003,0x2004,0x4001,0x2146,0x22AD,0x2299,0x4002,0x2147,0x22AE,0x229A,
                                                0x2110,0x2010,0x2012,0x201A,0x2278,0x215F,0x4005,0x2007,0x2002,0x2005,0x2259,0x2283,0x2254,0x404C,0x404D,0x3600,0x3601,0x2267,0x370D,0x2064,0x2065,0x2014,0x2273,0x2272,0x226C,0x2006,0x2301,0x2270,0x2271,0x2292,0x2261,0x2262,0x2263,0x2264,0x2265,0x4000,0x2208,0x2291,0x22BD,0x22C1,0x2142,0x22C5,0x22C9,0x22CD,0x2212,0x2210,0x300D,0x2256,0x2257,0x226A,0x2289,0x3704,0x300C,0x2290,0x299A,0x226B,0x3605,0x214E,0x2152,0x2258,0x2999,0x3715,0x3716,0x3717,0x2153,0x3003,0x370B,0x3700,0x300E,0x2250,0x226D,0x216F};
                for (auto m : mine) if (m == sidx) return;
                if (sidx >= 0x4010 && sidx < 0x4060) return;
                for (auto e : id(extra_poll)) if (e == sidx) return;
                if (id(scan_on)) return;
              }
              const bool is_wr = req && (scs & 0xE0) == 0x20;
              uint64_t val = 0;
              for (int i = 0; i < 8; i++) val |= ((uint64_t) x[i]) << (8 * i);
              const uint64_t key = ((uint64_t) can_id << 24) | ((uint64_t) sidx << 8) | ssub;
              auto &seen = id(sniff_seen);
              for (auto &p : seen) {
                if (p.first == key) {
                  if (p.second != val) {
                    ESP_LOGW("igneo", "SNIFF %sZMIANA id=0x%03X idx=0x%04X.%d dane=%s", is_wr ? "ZAPIS " : "", (unsigned) can_id, sidx, ssub, b);
                    p.second = val;
                  }
                  return;
                }
              }
              if (seen.size() < 600) seen.push_back({key, val});
              ESP_LOGI("igneo", "SNIFF %sNOWY id=0x%03X idx=0x%04X.%d dane=%s", is_wr ? "ZAPIS " : "", (unsigned) can_id, sidx, ssub, b);
      # Podajnik pracuje: PDO modulu CAN IO BIG (wezel 86) = 0x400 + 0x56 = 0x456, bajt 0, bit 0.
      # Z logow: 00->01 gdy podajnik wlaczony (ON), 01->00 gdy wrocil do Automatu/OFF.
      - can_id: 0x456
        then:
          - lambda: |-
              if (x.size() < 1) return;
              id(feeder_running).publish_state((x[0] & 0x01) != 0);
              {
                static uint8_t last[8] = {0}; static bool seen = false;
                bool ch = !seen;
                for (size_t i = 0; i < x.size() && i < 8; i++) if (x[i] != last[i]) { ch = true; last[i] = x[i]; }
                seen = true;
                if (ch) {
                  char b[40]; size_t p = 0;
                  for (size_t i = 0; i < x.size() && i < 8; i++) p += snprintf(b + p, sizeof(b) - p, "%02X ", x[i]);
                  ESP_LOGW("igneo", "PDO 0x456 zmiana: %s", b);
                }
              }
      # Dmuchawa pracuje: PDO modulu CAN IO BIG (wezel 86) = 0x300 + 0x56 = 0x356, bajt 0, bit 0.
      # Z logow: 00->01 gdy dmuchawa ruszyla (tryb ON), 01->00 gdy stanela.
      - can_id: 0x356
        then:
          - lambda: |-
              if (x.size() < 1) return;
              id(blower_running).publish_state((x[0] & 0x01) != 0);
              {
                static uint8_t last[8] = {0}; static bool seen = false;
                bool ch = !seen;
                for (size_t i = 0; i < x.size() && i < 8; i++) if (x[i] != last[i]) { ch = true; last[i] = x[i]; }
                seen = true;
                if (ch) {
                  char b[40]; size_t p = 0;
                  for (size_t i = 0; i < x.size() && i < 8; i++) p += snprintf(b + p, sizeof(b) - p, "%02X ", x[i]);
                  ESP_LOGW("igneo", "PDO 0x356 zmiana: %s", b);
                }
              }
      # Odpowiedzi innych wezlow (0x580+node) - tylko podczas skanu wezla != 4
      - can_id: 0x580
        can_id_mask: 0x780
        then:
          - lambda: |-
